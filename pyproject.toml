[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "video-tunner"
version = "0.1.0.dev0"
description = "Auditable, reversible spoken-video cleaner for Windows."
requires-python = ">=3.11"
authors = [{name = "WillsitoGG"}]
dependencies = []

[project.optional-dependencies]
analysis = [
    "faster-whisper>=1.2,<2",
]
packaging = [
    "pyinstaller==6.22.2",
]

[project.scripts]
video-tunner = "video_tunner.cli:main"

[tool.setuptools]
package-dir = {"" = "Source"}

[tool.setuptools.packages.find]
where = ["Source"]
