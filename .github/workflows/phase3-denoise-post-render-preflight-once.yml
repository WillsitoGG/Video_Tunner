name: Phase 3.6j Denoise Post-Render Preflight One-shot

on:
  push:
    paths:
      - ".github/phase3-denoise-post-render-preflight.trigger"

jobs:
  focused-preflight:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install editable package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile 3.6j implementation and tests
        run: python -m py_compile Source/video_tunner/denoise_post_render_verification.py tests/test_denoise_post_render_verification.py tests/test_phase3_denoise_post_render_precommit.py tests/test_denoise_post_render_verification_e2e_ffmpeg.py
      - name: Run focused contracts without real-tool E2E
        run: >-
          python -m unittest -v
          tests.test_denoise_post_render_verification
          tests.test_phase3_denoise_post_render_precommit
          tests.test_denoise_render
          tests.test_denoise_render_contract_binding
          tests.test_denoise_plan
          tests.test_denoise_execution_authorization
          tests.test_denoise_runtime
          tests.test_phase3_denoise_render_foundation_evidence
      - name: Scope note
        run: echo PHASE3_6J_PREFLIGHT=PASS
