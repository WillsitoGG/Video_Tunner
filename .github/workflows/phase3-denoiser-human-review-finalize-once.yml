name: Phase 3 Denoiser Human Review Finalize Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-denoiser-human-review-finalize-once.yml

permissions:
  contents: read

jobs:
  validate-human-review:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch snapshot
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure FFmpeg for integrated regression
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg --no-progress -y }
          ffmpeg -version | Select-Object -First 1

      - name: Install analysis profile
        run: python -m pip install -e .[analysis]

      - name: Recompute blinded remap and perceptual gate
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          @'
          import hashlib
          import json
          from pathlib import Path
          from video_tunner.denoise_human_review import remap_public_review_to_private, validate_completed_review, build_perceptual_gate

          root = Path('.')
          policy_path = root / 'tests/fixtures/phase3_denoiser_human_ab_policy_v1.json'
          technical_path = root / 'Validation/phase3-denoiser-human-ab-bundle-technical.json'
          public_path = root / 'Validation/phase3-denoiser-human-ab-public-review.json'
          private_path = root / 'Validation/phase3-denoiser-human-ab-review.json'
          gate_path = root / 'Validation/phase3-denoiser-human-perceptual-gate.json'

          policy_bytes = policy_path.read_bytes()
          policy_sha = hashlib.sha256(policy_bytes).hexdigest()
          policy = json.loads(policy_bytes)
          technical = json.loads(technical_path.read_text(encoding='utf-8'))
          public = json.loads(public_path.read_text(encoding='utf-8'))
          persisted_private = json.loads(private_path.read_text(encoding='utf-8'))
          persisted_gate = json.loads(gate_path.read_text(encoding='utf-8'))

          assert technical['valid'] is True
          assert technical['policy_sha256'] == policy_sha
          manifest_sha = technical['bundle_manifest_sha256']
          assert public['policy_sha256'] == policy_sha
          assert public['bundle_manifest_sha256'] == manifest_sha

          recomputed_private = remap_public_review_to_private(public_review=public, policy=policy)
          recomputed_private.pop('note', None)
          assert recomputed_private == persisted_private
          validate_completed_review(review=recomputed_private, policy=policy, expected_policy_sha256=policy_sha, expected_bundle_manifest_sha256=manifest_sha)

          recomputed_gate = build_perceptual_gate(review=recomputed_private, policy=policy, expected_policy_sha256=policy_sha, expected_bundle_manifest_sha256=manifest_sha)
          assert recomputed_gate == persisted_gate
          by_id = {x['pair_id']: x for x in recomputed_gate['pair_results']}
          df = by_id['deepfilternet_vs_preserve']
          aff = by_id['afftdn_vs_preserve']
          assert (df['treatment_preferences'], df['preserve_preferences'], df['no_preference']) == (10, 0, 0)
          assert df['perceptual_gate_pass'] is True
          assert df['status'] == 'ELIGIBLE_FOR_SELECTION_REVIEW'
          assert (aff['treatment_preferences'], aff['preserve_preferences'], aff['no_preference']) == (3, 2, 5)
          assert aff['perceptual_gate_pass'] is False
          assert aff['status'] == 'NOT_ADVANCED_PRESERVE_DEFAULT'
          assert recomputed_gate['interpretation']['candidate_selection_authorized'] is False
          assert recomputed_gate['interpretation']['denoise_authorized'] is False
          assert recomputed_gate['interpretation']['auto_apply'] is False
          print('PHASE3_36E_HUMAN_REVIEW_REMAP=PASS')
          print('PHASE3_36E_DEEPFILTERNET_PREFERENCES=10/10')
          print('PHASE3_36E_DEEPFILTERNET_GATE=PASS')
          print('PHASE3_36E_AFFTDN_PREFERENCES=3/10')
          print('PHASE3_36E_AFFTDN_PRESERVE=2/10')
          print('PHASE3_36E_AFFTDN_NO_PREFERENCE=5/10')
          print('PHASE3_36E_AFFTDN_GATE=FAIL')
          print('PHASE3_36E_PRODUCT_AUTHORIZATION=0')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full integrated regression
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Doctor
        shell: pwsh
        run: |
          video-tunner doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Phase 3.6e evidence validation only. DeepFilterNet may become eligible for a later selection review; this run does not select or authorize a denoiser, renderer treatment, or auto-apply."
