name: Phase 3 Normalization Execution Authorization Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-normalization-execution-authorization-once.yml

permissions:
  contents: read

jobs:
  windows-normalization-execution-authorization:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Phase 3.5a and 3.5b contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m py_compile .\Source\video_tunner\normalization_plan.py .\Source\video_tunner\normalization_execution_authorization.py
          python -m unittest tests.test_normalization_plan tests.test_normalization_execution_authorization -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE3_NORMALIZATION_EXECUTION_AUTHORIZATION=PASS"
      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "APPROVE authorizes only the future gated normalization render path. The plan remains non-executable; direct plan rendering and auto_apply remain forbidden."
