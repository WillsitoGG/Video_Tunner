name: Phase 2E Host Verifier Preflight Once

on:
  push:
    branches:
      - phase2e-post-render-verification
    paths:
      - .github/workflows/phase2e-host-verifier-preflight-once.yml

permissions:
  contents: read

jobs:
  windows-host-verifier-preflight:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused host verifier tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m py_compile .\.github\scripts\build_phase2e_review_bundle_case.py .\tests\test_phase2e_review_bundle_tooling.py
          python -m unittest tests.test_phase2e_review_bundle_tooling tests.test_tools_portable tests.test_post_render_verification -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE2E_HOST_VERIFIER_PREFLIGHT=PASS"
