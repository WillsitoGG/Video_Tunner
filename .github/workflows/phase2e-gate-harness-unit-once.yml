name: Phase 2E Gate Harness Unit Validation Once

on:
  push:
    branches:
      - phase2e-post-render-verification
    paths:
      - .github/triggers/phase2e-gate-harness-unit

jobs:
  windows-unit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Syntax preflight
        run: python -m py_compile .\.github\scripts\run_phase2e_12s3s_pipeline_gate.py .\tests\test_phase2e_12s3s_pipeline_gate_harness.py
      - name: Harness regression
        run: python -m unittest tests.test_phase2e_12s3s_pipeline_gate_harness -v
