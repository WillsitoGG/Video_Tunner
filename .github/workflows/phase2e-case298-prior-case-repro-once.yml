name: Phase 2E Case 298 Boundary Hardening Once

on:
  push:
    branches:
      - phase2e-post-render-verification
    paths:
      - .github/workflows/phase2e-case298-prior-case-repro-once.yml

permissions:
  contents: read

concurrency:
  group: video-tunner-phase2e-case298-boundary-${{ github.ref }}
  cancel-in-progress: true

env:
  PHASE2E_SOURCE_FIXTURE: tests\fixtures\phase2e_human_render_closeout_ami_v1.json
  PHASE2E_FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-05-13-10/ffmpeg-n9.0.1-26-g5c8e7e2433-win64-gpl-9.0.zip
  PHASE2E_EXPECTED_FFMPEG_SHA256: a8ebbaf7a99185f5abc3a2d3a657521c38d7966f06b70468d7ab29a67fe8654f
  PHASE2E_EXPECTED_FFMPEG_VERSION_TOKEN: n9.0.1-26-g5c8e7e2433

jobs:
  windows-case298-boundary:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned analysis runtime
        run: python -m pip install -e .[analysis]

      - name: Preflight focused boundary hardening
        shell: pwsh
        run: |
          python -m py_compile .\.github\scripts\run_phase2e_12s3s_pipeline_gate.py .\Source\video_tunner\transcription_consensus.py
          $env:PYTHONPATH = "$PWD\Source"
          python -m unittest tests.test_transcription_repeat_consensus tests.test_phase2e_12s3s_pipeline_gate_harness -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE2E_CASE298_BOUNDARY_PREFLIGHT=PASS"

      - name: Build case 298-only fixture
        shell: pwsh
        run: |
          $source = Get-Content $env:PHASE2E_SOURCE_FIXTURE -Raw | ConvertFrom-Json
          $case298 = @($source.cases | Where-Object { $_.id -eq "ami-ts3005d-c-repeat-298" })
          if ($case298.Count -ne 1) { throw "Expected unique case 298" }
          $only298 = $source.PSObject.Copy()
          $only298.cases = @($case298[0])
          $only298Path = Join-Path $env:RUNNER_TEMP "phase2e-only298.json"
          $only298 | ConvertTo-Json -Depth 20 | Set-Content -Encoding UTF8 $only298Path
          "PHASE2E_ONLY298_FIXTURE=$only298Path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Acquire immutable FFmpeg build
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "Video Tunner Phase2E Case298 Boundary FFmpeg"
          $zip = Join-Path $root "ffmpeg.zip"
          $extract = Join-Path $root "extract"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Invoke-WebRequest -Uri $env:PHASE2E_FFMPEG_URL -OutFile $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $env:PHASE2E_EXPECTED_FFMPEG_SHA256) { throw "FFmpeg archive SHA mismatch: $sha" }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem $extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $extract -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "Immutable FFmpeg archive missing tools" }
          $versionLine = (& $ffmpeg.FullName -version | Select-Object -First 1 | Out-String).Trim()
          if ($versionLine -notlike "*$($env:PHASE2E_EXPECTED_FFMPEG_VERSION_TOKEN)*") { throw "Unexpected FFmpeg build: $versionLine" }
          "PHASE2E_DIAGNOSTIC_FFMPEG=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VIDEO_TUNNER_FFMPEG_DIR=$($ffmpeg.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "PHASE2E_CASE298_BOUNDARY_FFMPEG_SHA256=$sha"
          Write-Host "PHASE2E_CASE298_BOUNDARY_FFMPEG_VERSION=$versionLine"

      - name: Download licensed AMI source
        shell: pwsh
        run: .\.github\scripts\download_ami_positive_closeout_fixtures.ps1 -Fixture $env:PHASE2E_ONLY298_FIXTURE

      - name: Acquire pinned large-v3-turbo model
        shell: pwsh
        run: .\.github\scripts\download_large_v3_turbo_direct.ps1

      - name: Stage pinned model root
        shell: pwsh
        run: |
          $modelRoot = Join-Path $env:RUNNER_TEMP "Video Tunner Phase2E Case298 Boundary ModelRoot"
          $modelDestination = Join-Path $modelRoot "whisper\large-v3-turbo"
          New-Item -ItemType Directory -Force -Path $modelDestination | Out-Null
          Copy-Item (Join-Path $env:SPANISH_TARGET_MODEL_STAGE "*") $modelDestination -Recurse -Force
          "VIDEO_TUNNER_MODEL_DIR=$modelRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run actual pipeline case 298 only
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          $env:HF_HUB_OFFLINE = "1"
          $env:HF_HUB_DISABLE_XET = "1"
          $output = Join-Path $env:RUNNER_TEMP "Video Tunner Phase2E Case298 Boundary"
          "PHASE2E_CASE298_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Append
          python .\.github\scripts\run_phase2e_12s3s_pipeline_gate.py `
            --fixture $env:PHASE2E_ONLY298_FIXTURE `
            --ffmpeg $env:PHASE2E_DIAGNOSTIC_FFMPEG `
            --output $output
          $exit = $LASTEXITCODE
          $manifest = Get-Content (Join-Path $output "manifest.json") -Raw | ConvertFrom-Json
          $case = @($manifest.cases | Where-Object { $_.id -eq "ami-ts3005d-c-repeat-298" })
          if ($case.Count -ne 1) { throw "Missing case 298 result" }
          Write-Host "PHASE2E_CASE298_BOUNDARY_PASS=$([int][bool]$case[0].pass) HARNESS_EXIT=$exit PROMOTIONS=$($case[0].promotion_match_count) STRATEGY_OK=$([int][bool]$case[0].strategy_ok) TIMING_OK=$([int][bool]$case[0].timing_ok) CHAIN_OK=$([int][bool]$case[0].chain_ok)"
          if ($exit -ne 0 -or -not [bool]$case[0].pass) { exit 1 }

      - name: Upload lightweight JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2e-case298-boundary-hardening
          path: ${{ env.PHASE2E_CASE298_OUTPUT }}\**\*.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Scope note
        if: always()
        shell: pwsh
        run: |
          Write-Host "One precommitted AMI case only: ami-ts3005d-c-repeat-298."
          Write-Host "Immutable FFmpeg asset and pinned large-v3-turbo model are verified before execution."
          Write-Host "Boundary reconciliation requires two straddling repeat supporters with the same predecessor token/text and timing, both without strong punctuation."
          Write-Host "Any missing/conflicting predecessor evidence leaves punctuation unchanged and existing join safety remains authoritative."
          Write-Host "No product default, threshold, timing tolerance, semantic guard, acoustic guard, approval, authorization or render behavior is relaxed."
