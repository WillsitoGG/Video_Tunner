name: Phase 3.6i Renderer Hardening Preflight One-shot

on:
  push:
    paths:
      - ".github/phase3-denoise-render-hardening-preflight.trigger"

jobs:
  focused-preflight:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install editable package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile renderer and tests
        run: python -m py_compile Source/video_tunner/denoise_render.py tests/test_denoise_render.py tests/test_denoise_render_contract_binding.py tests/test_denoise_render_e2e_ffmpeg.py
      - name: Run focused contracts
        run: >-
          python -m unittest -v
          tests.test_denoise_render
          tests.test_denoise_render_contract_binding
          tests.test_denoise_plan
          tests.test_denoise_execution_authorization
          tests.test_denoise_runtime
          tests.test_phase3_denoise_plan_authorization_evidence
      - name: Scope note
        run: echo PHASE3_6I_HARDENING_PREFLIGHT=PASS
