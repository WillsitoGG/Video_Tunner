name: Phase 3 Treatment Foundation Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-treatment-foundation-once.yml

permissions:
  contents: read

jobs:
  windows-treatment-foundation:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          ffmpeg -version | Select-Object -First 1
      - name: Validate Phase 3.1 and 3.2 foundations
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m py_compile .\Source\video_tunner\audiovisual_quality.py .\Source\video_tunner\audiovisual_treatment.py
          python -m unittest tests.test_audiovisual_quality tests.test_audiovisual_quality_e2e_ffmpeg tests.test_audiovisual_treatment -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE3_TREATMENT_FOUNDATION=PASS"
      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Clean audit -> bypass/preserve. Risk -> review. No treatment parameters, execution capability or auto_apply are created."
