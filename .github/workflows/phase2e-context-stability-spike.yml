name: Phase 2E Context Stability Spike

on:
  workflow_dispatch:

concurrency:
  group: video-tunner-phase2e-context-${{ github.ref }}
  cancel-in-progress: true

env:
  PHASE2E_CONTEXT_FIXTURE: tests\fixtures\phase2e_human_render_closeout_ami_v1.json

jobs:
  windows-context-stability:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight diagnostic scripts
        shell: pwsh
        run: |
          foreach ($path in @(
            ".\.github\scripts\download_ami_positive_closeout_fixtures.ps1",
            ".\.github\scripts\download_large_v3_turbo_direct.ps1",
            ".\.github\scripts\build_portable_windows.ps1",
            ".\.github\scripts\run_phase2e_context_stability.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$path :: $($_.Message)" }
              throw "PowerShell parser errors: $path"
            }
          }
          python -m py_compile .\.github\scripts\summarize_phase2e_context_case.py
          $env:PYTHONPATH = "$PWD\Source"
          python -m unittest discover -s tests -p "test_phase2e_human_render_closeout_fixture.py" -v
          Write-Host "PHASE2E_CONTEXT_PREFLIGHT=PASS"

      - name: Download licensed AMI speaker-specific sources
        shell: pwsh
        run: .\.github\scripts\download_ami_positive_closeout_fixtures.ps1 -Fixture $env:PHASE2E_CONTEXT_FIXTURE

      - name: Acquire pinned large-v3-turbo model
        shell: pwsh
        run: .\.github\scripts\download_large_v3_turbo_direct.ps1

      - name: Build analysis portable
        shell: pwsh
        run: .\.github\scripts\build_portable_windows.ps1 -Profile analysis

      - name: Diagnose context stability on locked human cases
        shell: pwsh
        run: .\.github\scripts\run_phase2e_context_stability.ps1 -Fixture $env:PHASE2E_CONTEXT_FIXTURE

      - name: Upload lightweight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2e-context-stability-diagnostics
          path: ${{ runner.temp }}\Video Tunner Phase2E Context Diagnostics
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Scope note
        if: always()
        shell: pwsh
        run: |
          Write-Host "Diagnostic only: no approval, proposal authorization, materialized edit or render is performed."
          Write-Host "It uses the same three locked AMI cases and the same deterministic real-context windows as Phase 2E.5."
          Write-Host "Its sole purpose is to attribute context-sensitive promotion loss to the exact upstream guard."
