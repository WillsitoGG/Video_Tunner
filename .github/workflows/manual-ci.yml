name: Manual CI

on:
  workflow_dispatch:
  push:
    branches:
      - phase2-semantic-protection
    paths:
      - Validation/phase2-semantic-protection.trigger

concurrency:
  group: video-tunner-manual-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-core:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure FFmpeg is available for development validation
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Install editable package and lightweight sync dependency
        run: python -m pip install -e . numpy==2.5.2

      - name: Run unit and synthetic end-to-end tests
        run: python -m unittest discover -s tests -v

      - name: Runtime doctor
        run: video-tunner doctor

      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "This workflow validates the development core plus the NumPy-backed sync estimator."
          Write-Host "It does not install Whisper/CTranslate2/ONNX or claim portable ML validation."
          Write-Host "It does not claim portable Windows validation because FFmpeg may come from the runner/Chocolatey."
