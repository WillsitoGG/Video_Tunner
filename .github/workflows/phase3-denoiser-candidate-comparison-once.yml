name: Phase 3 Denoiser Candidate Comparison Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-denoiser-candidate-comparison-once.yml

permissions:
  contents: read

jobs:
  objective-comparison:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure FFmpeg 9.0.1 and frozen afftdn contract
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          $version = ffmpeg -version | Select-Object -First 1
          Write-Host "PHASE3_COMPARE_FFMPEG_VERSION=$version"
          if ($version -notmatch "9\.0\.1") { throw "FFmpeg version contract mismatch" }
          $help = ffmpeg -hide_banner -h filter=afftdn 2>&1 | Out-String
          if ($help -notmatch "Denoise audio samples using FFT") { throw "afftdn unavailable" }
          if ($help -notmatch "noise_reduction.*default 12") { throw "afftdn nr contract changed" }
          if ($help -notmatch "noise_floor.*default -50") { throw "afftdn nf contract changed" }

      - name: Install pinned evaluation-only dependencies
        run: python -m pip install -e . numpy==2.5.2 scipy==1.18.1 pystoi==0.4.1

      - name: Validate frozen comparison contract before corpus access
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m py_compile .\Source\video_tunner\denoise_objective.py .\.github\scripts\build_phase3_denoiser_candidate_comparison.py
          python -m unittest tests.test_denoise_objective tests.test_denoise_candidate_evaluation_primitives tests.test_phase3_denoiser_candidate_comparison_policy tests.test_phase3_denoise_evaluation_corpus_fixture tests.test_phase3_denoise_corpus_materialization_evidence tests.test_phase3_denoise_objective_baseline_evidence -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize exact checksum-verified frozen corpus
        run: python .github/scripts/validate_phase3_denoise_corpus.py

      - name: Evaluate exact precommitted candidate set on all noisy and clean controls
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python .github/scripts/build_phase3_denoiser_candidate_comparison.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload lightweight comparison evidence only
        uses: actions/upload-artifact@v4
        with:
          name: phase3-denoiser-candidate-objective-comparison
          path: phase3-denoiser-candidate-comparison.json
          if-no-files-found: error
          retention-days: 7

      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Phase 3.6d objective comparison only. Three precommitted arms, exact 40 noisy cases, exact 40 clean controls for each treatment candidate. No winner label, threshold, candidate selection, denoise authorization, renderer authorization or auto_apply is created. Human perceptual A/B remains mandatory."
