name: Phase 3.6i Binder Preflight One-shot

on:
  push:
    paths:
      - ".github/phase3-denoise-render-binder-preflight.trigger"

jobs:
  binder:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install editable package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Validate persisted Phase 3.6i binder and master docs
        run: python -m unittest -v tests.test_phase3_denoise_render_foundation_evidence
      - name: Scope note
        run: echo PHASE3_6I_BINDER_PREFLIGHT=PASS
