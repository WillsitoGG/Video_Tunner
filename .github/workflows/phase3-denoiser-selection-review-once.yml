name: Phase 3 Denoiser Selection Review Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-denoiser-selection-review-once.yml

permissions:
  contents: read

jobs:
  selection-review:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout frozen selection snapshot
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Focused Phase 3.6f tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m py_compile .\Source\video_tunner\denoise_selection.py
          python -m unittest tests.test_denoise_selection -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build exact selection review from frozen evidence
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          @'
          import json
          from pathlib import Path
          from video_tunner.denoise_selection import build_denoiser_selection_review

          root = Path('.')
          objective = json.loads((root/'Validation/phase3-denoiser-candidate-objective-comparison.json').read_text(encoding='utf-8'))
          human = json.loads((root/'Validation/phase3-denoiser-human-perceptual-gate.json').read_text(encoding='utf-8'))
          policy = json.loads((root/'tests/fixtures/phase3_denoiser_selection_policy_v1.json').read_text(encoding='utf-8'))
          review = build_denoiser_selection_review(objective_evidence=objective, human_gate=human, policy=policy)
          out = root/'phase3-denoiser-selection-review.json'
          out.write_text(json.dumps(review, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          assert review['status'] == 'SELECTED_FOR_INTEGRATION_REVIEW'
          assert review['selected_candidate_id'] == 'deepfilternet_0_5_6_compensated_v1'
          assert review['selection_eligible_candidates'] == ['deepfilternet_0_5_6_compensated_v1']
          assert review['interpretation']['product_default'] == 'preserve'
          assert review['interpretation']['denoise_authorized'] is False
          assert review['interpretation']['renderer_authorized'] is False
          assert review['interpretation']['auto_apply'] is False
          evaluation = review['candidate_evaluations'][0]
          print('PHASE3_36F_SELECTION_STATUS=' + review['status'])
          print('PHASE3_36F_SELECTED_CANDIDATE=' + review['selected_candidate_id'])
          print(f"PHASE3_36F_SI_SDR_MEAN_DELTA={evaluation['mean_delta_vs_preserve']['si_sdr_db']:.8f}")
          print(f"PHASE3_36F_STOI_MEAN_DELTA={evaluation['mean_delta_vs_preserve']['stoi']:.8f}")
          print(f"PHASE3_36F_SI_SDR_POSITIVE_CASES={evaluation['positive_case_counts']['si_sdr_db']}/40")
          print(f"PHASE3_36F_STOI_POSITIVE_CASES={evaluation['positive_case_counts']['stoi']}/40")
          print('PHASE3_36F_PRODUCT_DEFAULT=preserve')
          print('PHASE3_36F_EXECUTION_AUTHORIZATION=0')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload selection evidence only
        uses: actions/upload-artifact@v4
        with:
          name: phase3-denoiser-selection-review
          path: phase3-denoiser-selection-review.json
          if-no-files-found: error
          retention-days: 14

      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Phase 3.6f evidence review only. A selected candidate is selected for integration review, not activated as product default and not authorized for rendering or auto-apply."
