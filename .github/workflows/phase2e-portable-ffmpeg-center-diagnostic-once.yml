name: Phase 2E Portable FFmpeg Center Diagnostic Once

on:
  push:
    branches:
      - phase2e-post-render-verification
    paths:
      - .github/triggers/phase2e-portable-ffmpeg-center

concurrency:
  group: video-tunner-phase2e-portable-ffmpeg-center-once-${{ github.ref }}
  cancel-in-progress: true

env:
  PHASE2E_HUMAN_FIXTURE: tests\fixtures\phase2e_human_render_closeout_ami_v1.json
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip
  EXPECTED_FFMPEG_ARCHIVE_SHA256: 87c4729f3193f3ba562bada0330a98338c9a858d25b15fc98338a1364667348b

jobs:
  windows-portable-ffmpeg-center:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight
        shell: pwsh
        run: python -m py_compile .\.github\scripts\run_phase2e_aac_master_center_diagnostic.py
      - name: Install analysis runtime
        run: python -m pip install -e .[analysis]
      - name: Acquire exact FFmpeg
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "phase2e-ffmpeg.zip"
          $extract = Join-Path $env:RUNNER_TEMP "phase2e-ffmpeg"
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "PHASE2E_PORTABLE_FFMPEG_ARCHIVE_SHA256=$sha"
          if ($sha -ne $env:EXPECTED_FFMPEG_ARCHIVE_SHA256) { throw "FFmpeg archive changed." }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem $extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $bin = Split-Path $ffmpeg.FullName -Parent
          "VIDEO_TUNNER_FFMPEG_DIR=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PHASE2E_DIAGNOSTIC_FFMPEG=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $ffmpeg.FullName -version | Select-Object -First 1
      - name: Download AMI sources
        shell: pwsh
        run: .\.github\scripts\download_ami_positive_closeout_fixtures.ps1 -Fixture $env:PHASE2E_HUMAN_FIXTURE
      - name: Acquire model
        shell: pwsh
        run: .\.github\scripts\download_large_v3_turbo_direct.ps1
      - name: Diagnose exact codec path
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          $env:HF_HUB_OFFLINE = "1"
          $env:HF_HUB_DISABLE_XET = "1"
          $output = Join-Path $env:RUNNER_TEMP "Video Tunner Phase2E Portable FFmpeg Center Diagnostic"
          python .\.github\scripts\run_phase2e_aac_master_center_diagnostic.py --fixture $env:PHASE2E_HUMAN_FIXTURE --model-stage $env:SPANISH_TARGET_MODEL_STAGE --ffmpeg $env:PHASE2E_DIAGNOSTIC_FFMPEG --output $output
      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2e-portable-ffmpeg-center-diagnostic
          path: ${{ runner.temp }}\Video Tunner Phase2E Portable FFmpeg Center Diagnostic\manifest.json
          retention-days: 7
          compression-level: 9
