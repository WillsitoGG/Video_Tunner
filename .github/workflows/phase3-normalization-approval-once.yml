name: Phase 3 Normalization Approval Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-normalization-approval-once.yml

permissions:
  contents: read

jobs:
  windows-normalization-approval:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Phase 3.3 and 3.4 contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m py_compile .\Source\video_tunner\normalization_profiles.py .\Source\video_tunner\normalization_approval.py
          python -m unittest tests.test_normalization_profiles tests.test_normalization_approval -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE3_NORMALIZATION_APPROVAL=PASS"
      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "APPROVE authorizes only preparation of the next normalization-planning gate. It does not authorize filters, rendering, semantic changes or auto_apply."
