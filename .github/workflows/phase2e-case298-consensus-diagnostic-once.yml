name: Phase 2E Case 298 Consensus Diagnostic Once

on:
  push:
    branches:
      - phase2e-post-render-verification
    paths:
      - .github/workflows/phase2e-case298-consensus-diagnostic-once.yml

concurrency:
  group: video-tunner-phase2e-case298-consensus-${{ github.ref }}
  cancel-in-progress: true

env:
  PHASE2E_HUMAN_FIXTURE: tests\fixtures\phase2e_human_render_closeout_ami_v1.json
  PHASE2E_FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip
  PHASE2E_EXPECTED_FFMPEG_SHA256: 87c4729f3193f3ba562bada0330a98338c9a858d25b15fc98338a1364667348b

jobs:
  windows-case298-consensus:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight diagnostic
        shell: pwsh
        run: |
          python -m py_compile .\.github\scripts\run_phase2e_case298_consensus_diagnostic.py .\Source\video_tunner\transcription_consensus.py
          Write-Host "PHASE2E_CASE298_CONSENSUS_PREFLIGHT=PASS"

      - name: Install pinned analysis runtime
        run: python -m pip install -e .[analysis]

      - name: Acquire exact FFmpeg archive from human gate
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "Video Tunner Phase2E Case298 Exact FFmpeg"
          $zip = Join-Path $root "ffmpeg.zip"
          $extract = Join-Path $root "extract"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Invoke-WebRequest -Uri $env:PHASE2E_FFMPEG_URL -OutFile $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "PHASE2E_CASE298_FFMPEG_ARCHIVE_SHA256=$sha"
          if ($sha -ne $env:PHASE2E_EXPECTED_FFMPEG_SHA256) {
            throw "FFmpeg archive SHA mismatch: $sha"
          }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem $extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $extract -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "Exact FFmpeg archive missing tools" }
          "PHASE2E_DIAGNOSTIC_FFMPEG=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VIDEO_TUNNER_FFMPEG_DIR=$($ffmpeg.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PHASE2E_DIAGNOSTIC_FFMPEG_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $ffmpeg.FullName -version | Select-Object -First 1

      - name: Download licensed AMI speaker-specific sources
        shell: pwsh
        run: .\.github\scripts\download_ami_positive_closeout_fixtures.ps1 -Fixture $env:PHASE2E_HUMAN_FIXTURE

      - name: Acquire pinned large-v3-turbo model
        shell: pwsh
        run: .\.github\scripts\download_large_v3_turbo_direct.ps1

      - name: Diagnose exact repeat-consensus checks for case 298
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          $env:HF_HUB_OFFLINE = "1"
          $env:HF_HUB_DISABLE_XET = "1"
          $output = Join-Path $env:RUNNER_TEMP "Video Tunner Phase2E Case298 Consensus Diagnostic"
          python .\.github\scripts\run_phase2e_case298_consensus_diagnostic.py `
            --fixture $env:PHASE2E_HUMAN_FIXTURE `
            --model-stage $env:SPANISH_TARGET_MODEL_STAGE `
            --ffmpeg $env:PHASE2E_DIAGNOSTIC_FFMPEG `
            --ffmpeg-archive-sha256 $env:PHASE2E_DIAGNOSTIC_FFMPEG_SHA256 `
            --output $output

      - name: Upload lightweight diagnostic manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2e-case298-consensus-diagnostic
          path: ${{ runner.temp }}\Video Tunner Phase2E Case298 Consensus Diagnostic\manifest.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Scope note
        if: always()
        shell: pwsh
        run: |
          Write-Host "Diagnostic only: case 298, windows 12-24 / 15-27 / 18-30 on exact pinned FFmpeg AAC -> product ingest master."
          Write-Host "Records raw repeat hypotheses and every current repeat-consensus condition."
          Write-Host "No threshold, detector, guard, product default, approval, edit, authorization or render is changed."
