name: Phase 3 Denoise Objective Baseline Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-denoise-objective-baseline-once.yml

permissions:
  contents: read

jobs:
  objective-baseline:
    runs-on: windows-2025
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned evaluation-only metric dependencies
        run: python -m pip install numpy==2.5.2 scipy==1.18.1 pystoi==0.4.1
      - name: Validate precommitted 3.6c metric contract before corpus measurement
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m py_compile .\Source\video_tunner\denoise_objective.py
          python -m unittest tests.test_denoise_objective tests.test_phase3_denoise_evaluation_corpus_fixture tests.test_phase3_denoise_corpus_materialization_evidence -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Materialize checksum-verified frozen corpus
        run: python .github/scripts/validate_phase3_denoise_corpus.py
      - name: Measure precommitted noisy baseline with SI-SDR and classic STOI
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python .github/scripts/build_phase3_denoise_objective_baseline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload lightweight objective baseline only
        uses: actions/upload-artifact@v4
        with:
          name: phase3-denoise-objective-baseline
          path: phase3-denoise-objective-baseline.json
          if-no-files-found: error
          retention-days: 7
      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Phase 3.6c is descriptive baseline only. SI-SDR/STOI are auxiliary metrics; no acceptance threshold, ranking, denoiser selection, denoise authorization, renderer authorization or auto_apply is created."
