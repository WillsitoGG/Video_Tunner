name: Phase 2E Consensus Boundary Unit Once

on:
  push:
    branches:
      - phase2e-post-render-verification
    paths:
      - .github/workflows/phase2e-consensus-boundary-unit-once.yml

permissions:
  contents: read

concurrency:
  group: video-tunner-phase2e-consensus-boundary-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-unit:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run focused consensus boundary tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m py_compile .\Source\video_tunner\transcription_consensus.py .\tests\test_transcription_repeat_consensus.py
          python -m unittest tests.test_transcription_repeat_consensus -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE2E_CONSENSUS_BOUNDARY_UNIT=PASS"

      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Focused unit validation only. No model download, FFmpeg build, render, threshold or safety-guard change."
