name: Portable Foundation Spike

on:
  workflow_dispatch:
  push:
    branches:
      - phase1a-portable-foundation
    paths:
      - Validation/portable-spike.trigger

concurrency:
  group: video-tunner-portable-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable-core:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build Python only
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run source tests before packaging
        shell: pwsh
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v

      - name: Build one-folder portable with bundled FFmpeg
        shell: pwsh
        run: .\.github\scripts\build_portable_windows.ps1

      - name: Validate from isolated path with no Python or FFmpeg on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $PWD "dist\Video_Tunner"
          $isolated = Join-Path $env:RUNNER_TEMP "Video Tunner Portable Test"
          Remove-Item $isolated -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item $source $isolated -Recurse

          $exe = Join-Path $isolated "Video_Tunner.exe"
          $ffmpeg = Join-Path $isolated "Tools\ffmpeg\bin\ffmpeg.exe"
          $ffprobe = Join-Path $isolated "Tools\ffmpeg\bin\ffprobe.exe"
          $input = Join-Path $isolated "Temp\sample input.mp4"
          $outputDir = Join-Path $isolated "Output\output with spaces"

          $env:VIDEO_TUNNER_PORTABLE_STRICT = "1"
          Remove-Item Env:VIDEO_TUNNER_FFMPEG_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:VIDEO_TUNNER_MODEL_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"

          if (Get-Command python -ErrorAction SilentlyContinue) { throw "Python sigue disponible en el PATH aislado." }
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { throw "FFmpeg externo sigue disponible en el PATH aislado." }

          & $exe doctor
          if ($LASTEXITCODE -ne 0) { throw "doctor falló en modo portable estricto." }

          & $ffmpeg -hide_banner -loglevel error -y `
            -f lavfi -i "color=c=black:s=320x240:r=25:d=3" `
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=1" `
            -f lavfi -i "anullsrc=r=48000:cl=mono:d=1" `
            -f lavfi -i "sine=frequency=660:sample_rate=48000:duration=1" `
            -filter_complex "[1:a][2:a][3:a]concat=n=3:v=0:a=1[a]" `
            -map "0:v:0" -map "[a]" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest $input
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear el fixture con FFmpeg empaquetado." }

          & $exe probe $input
          if ($LASTEXITCODE -ne 0) { throw "probe portable falló." }

          & $exe clean $input --mode conservative --output-dir $outputDir
          if ($LASTEXITCODE -ne 0) { throw "clean portable falló." }

          $rendered = Join-Path $outputDir "sample input_clean.mp4"
          if (-not (Test-Path $rendered)) { throw "No existe el render portable esperado." }

          & $ffprobe -v error -show_entries format=duration -of default=nw=1 $rendered
          if ($LASTEXITCODE -ne 0) { throw "ffprobe empaquetado no valida el render." }

      - name: Report package size and SHA without uploading artifact
        shell: pwsh
        run: |
          $portable = Join-Path $PWD "dist\Video_Tunner"
          $zip = Join-Path $env:RUNNER_TEMP "Video_Tunner_portable_spike.zip"
          Compress-Archive -Path "$portable\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          $size = (Get-Item $zip).Length
          Write-Host "PORTABLE_SPIKE_BYTES=$size"
          Write-Host "PORTABLE_SPIKE_SHA256=$hash"
          Write-Host "The ZIP is deliberately NOT uploaded as a GitHub Actions artifact."
