name: Phase 3 Denoiser Candidate Tools Preflight Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-denoiser-candidate-tools-preflight-once.yml

permissions:
  contents: read

jobs:
  candidate-tools:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure FFmpeg 9.0.1 and afftdn availability
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          $version = ffmpeg -version | Select-Object -First 1
          Write-Host "PHASE3_AFFTDN_FFMPEG_VERSION=$version"
          $help = ffmpeg -hide_banner -h filter=afftdn 2>&1 | Out-String
          if ($help -notmatch "Denoise audio samples using FFT") { throw "afftdn filter unavailable" }
          if ($help -notmatch "noise_reduction.*default 12") { throw "afftdn default noise_reduction contract changed" }
          if ($help -notmatch "noise_floor.*default -50") { throw "afftdn default noise_floor contract changed" }
          Write-Host "PHASE3_AFFTDN_AVAILABLE=PASS"
      - name: Acquire exact DeepFilterNet Windows candidate without corpus access
        shell: pwsh
        run: |
          $url = "https://github.com/Rikorose/DeepFilterNet/releases/download/v0.5.6/deep-filter-0.5.6-x86_64-pc-windows-msvc.exe"
          $exe = Join-Path $env:RUNNER_TEMP "deep-filter-0.5.6-x86_64-pc-windows-msvc.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $size = (Get-Item $exe).Length
          Write-Host "PHASE3_DEEPFILTERNET_ASSET_SHA256=$sha"
          Write-Host "PHASE3_DEEPFILTERNET_ASSET_SIZE=$size"
          $version = & $exe --version 2>&1 | Out-String
          Write-Host "PHASE3_DEEPFILTERNET_VERSION=$($version.Trim())"
          if ($version -notmatch "0\.5\.6") { throw "DeepFilterNet candidate version mismatch" }
          $help = & $exe --help 2>&1 | Out-String
          if ($help -notmatch "compensate-delay") { throw "DeepFilterNet candidate lacks delay compensation contract" }
          if ($help -notmatch "Defaults to DeepFilterNet2") { throw "DeepFilterNet default model contract changed" }
          Write-Host "PHASE3_DEEPFILTERNET_ACQUISITION=PASS"
      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Tool acquisition only. The frozen denoise corpus was not downloaded or evaluated. No candidate metrics, ranking, selection, treatment authorization, renderer authorization or auto_apply is produced."
