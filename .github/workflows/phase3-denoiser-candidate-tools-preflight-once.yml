name: Phase 3 Denoiser Candidate Tools Preflight Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-denoiser-candidate-tools-preflight-once.yml

permissions:
  contents: read

jobs:
  candidate-tools:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure FFmpeg 9.0.1 and afftdn availability
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          $version = ffmpeg -version | Select-Object -First 1
          Write-Host "PHASE3_AFFTDN_FFMPEG_VERSION=$version"
          $help = ffmpeg -hide_banner -h filter=afftdn 2>&1 | Out-String
          if ($help -notmatch "Denoise audio samples using FFT") { throw "afftdn filter unavailable" }
          if ($help -notmatch "noise_reduction.*default 12") { throw "afftdn default noise_reduction contract changed" }
          if ($help -notmatch "noise_floor.*default -50") { throw "afftdn default noise_floor contract changed" }
          Write-Host "PHASE3_AFFTDN_AVAILABLE=PASS"
      - name: Acquire and smoke-test exact DeepFilterNet Windows candidate without corpus access
        shell: pwsh
        run: |
          $url = "https://github.com/Rikorose/DeepFilterNet/releases/download/v0.5.6/deep-filter-0.5.6-x86_64-pc-windows-msvc.exe"
          $expectedSha = "75e11fa16445f560cb6b021521ddb89e89270d13b83089705d98776f58fd7915"
          $exe = Join-Path $env:RUNNER_TEMP "deep-filter-0.5.6-x86_64-pc-windows-msvc.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $size = (Get-Item $exe).Length
          Write-Host "PHASE3_DEEPFILTERNET_ASSET_SHA256=$sha"
          Write-Host "PHASE3_DEEPFILTERNET_ASSET_SIZE=$size"
          if ($sha -ne $expectedSha) { throw "DeepFilterNet asset SHA mismatch" }
          $version = & $exe --version 2>&1 | Out-String
          Write-Host "PHASE3_DEEPFILTERNET_VERSION=$($version.Trim())"
          if ($version -notmatch "0\.5\.6") { throw "DeepFilterNet candidate version mismatch" }
          $help = & $exe --help 2>&1 | Out-String
          if ($help -notmatch "compensate-delay") { throw "DeepFilterNet candidate lacks delay compensation contract" }

          $input = Join-Path $env:RUNNER_TEMP "phase3_df_synthetic.wav"
          $outDir = Join-Path $env:RUNNER_TEMP "phase3_df_out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          ffmpeg -hide_banner -loglevel error -y `
            -f lavfi -i "sine=frequency=220:sample_rate=48000:duration=3" `
            -f lavfi -i "anoisesrc=color=white:amplitude=0.05:sample_rate=48000:duration=3" `
            -filter_complex "[0:a][1:a]amix=inputs=2:duration=first:normalize=0" `
            -ac 1 -c:a pcm_s16le $input
          if ($LASTEXITCODE -ne 0) { throw "Synthetic input generation failed" }
          & $exe --compensate-delay --out-dir $outDir $input
          if ($LASTEXITCODE -ne 0) { throw "DeepFilterNet synthetic render failed" }
          $outputs = @(Get-ChildItem -Path $outDir -Filter *.wav -File)
          if ($outputs.Count -ne 1) { throw "Expected exactly one DeepFilterNet WAV output, got $($outputs.Count)" }
          $output = $outputs[0].FullName
          $srcRate = (ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=nw=1:nk=1 $input).Trim()
          $outRate = (ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=nw=1:nk=1 $output).Trim()
          $srcDuration = [double]((ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 $input).Trim())
          $outDuration = [double]((ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 $output).Trim())
          Write-Host "PHASE3_DEEPFILTERNET_SYNTHETIC_SOURCE_DURATION=$srcDuration"
          Write-Host "PHASE3_DEEPFILTERNET_SYNTHETIC_OUTPUT_DURATION=$outDuration"
          if ($srcRate -ne "48000" -or $outRate -ne "48000") { throw "DeepFilterNet 48 kHz contract failed" }
          if ([math]::Abs($srcDuration - $outDuration) -gt 0.05) { throw "DeepFilterNet delay-compensated duration changed by more than 50 ms" }
          Write-Host "PHASE3_DEEPFILTERNET_ACQUISITION=PASS"
      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Tool acquisition and synthetic smoke test only. The frozen denoise corpus was not downloaded or evaluated. No candidate metrics, ranking, selection, treatment authorization, renderer authorization or auto_apply is produced."
