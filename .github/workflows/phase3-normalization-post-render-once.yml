name: Phase 3 Normalization Post-render Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-normalization-post-render-once.yml

permissions:
  contents: read

jobs:
  windows-normalization-post-render:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - name: Validate Phase 3.5d unit and real FFmpeg E2E
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m py_compile .\Source\video_tunner\normalization_render.py .\Source\video_tunner\normalization_post_render_verification.py
          python -m unittest tests.test_normalization_render tests.test_normalization_post_render_verification tests.test_normalization_render_e2e_ffmpeg -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE3_NORMALIZATION_POST_RENDER=PASS"
      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Technical normalization PASS remains separate from human perceptual PASS. Invalid/stale evidence is not reclassified as quality failure. preserve remains default; no denoise, join smoothing or auto_apply."
