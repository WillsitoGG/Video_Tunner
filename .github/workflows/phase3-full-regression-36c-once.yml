name: Phase 3 Full Regression Through 3.6c Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-full-regression-36c-once.yml

permissions:
  contents: read

jobs:
  windows-regression:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - name: Install development and evaluation dependencies
        run: python -m pip install -e . numpy==2.5.2 scipy==1.18.1 pystoi==0.4.1
      - name: Run full regression
        run: python -m unittest discover -s tests -v
      - name: Runtime doctor
        run: video-tunner doctor
      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Full regression through Phase 3.6c. The clean/noisy objective baseline is descriptive only. No acceptance threshold, denoiser ranking/selection, denoise authorization, renderer authorization or auto_apply is created."
