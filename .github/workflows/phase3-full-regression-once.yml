name: Phase 3 Full Regression Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-full-regression-once.yml

permissions:
  contents: read

jobs:
  windows-regression:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - name: Install development package
        run: python -m pip install -e . numpy==2.5.2
      - name: Run full regression
        run: python -m unittest discover -s tests -v
      - name: Runtime doctor
        run: video-tunner doctor
      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Full regression through Phase 3.4. No normalization renderer, denoise, join smoothing or auto_apply is authorized."
