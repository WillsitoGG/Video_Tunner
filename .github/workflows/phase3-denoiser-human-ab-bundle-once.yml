name: Phase 3 Denoiser Human AB Bundle Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-denoiser-human-ab-bundle-once.yml

permissions:
  contents: read

jobs:
  build-blinded-bundle:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout frozen branch snapshot
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure exact FFmpeg 9.0.1 contract
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          $version = ffmpeg -version | Select-Object -First 1
          Write-Host "PHASE3_36E_FFMPEG_VERSION=$version"
          if ($version -notmatch "9\.0\.1") { throw "FFmpeg version contract mismatch" }
          $help = ffmpeg -hide_banner -h filter=afftdn 2>&1 | Out-String
          if ($help -notmatch "Denoise audio samples using FFT") { throw "afftdn unavailable" }
          if ($help -notmatch "noise_reduction.*default 12") { throw "afftdn nr contract changed" }
          if ($help -notmatch "noise_floor.*default -50") { throw "afftdn nf contract changed" }

      - name: Install evaluation-only dependencies
        run: python -m pip install -e . numpy==2.5.2

      - name: Preflight frozen 3.6e policy and human gate
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m py_compile .\.github\scripts\build_phase3_denoiser_human_ab_bundle.py .\Source\video_tunner\denoise_human_review.py
          python -m unittest tests.test_phase3_denoiser_human_ab_policy tests.test_denoise_human_review tests.test_phase3_denoiser_candidate_comparison_evidence -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize exact checksum-verified frozen corpus
        run: python .github/scripts/validate_phase3_denoise_corpus.py

      - name: Build blinded listening bundle
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python .github/scripts/build_phase3_denoiser_human_ab_bundle.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify public bundle has no hidden policy/key files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path phase3-denoiser-human-ab-bundle -Recurse -File
          $unexpected = $files | Where-Object { $_.Name -notin @('A.wav','B.wav','clean_reference.wav','manifest.json','human_review_decisions.json','README.txt') }
          if ($unexpected) { throw "Unexpected public bundle files: $($unexpected.FullName -join ', ')" }
          $wavCount = ($files | Where-Object { $_.Extension -eq '.wav' }).Count
          if ($wavCount -ne 50) { throw "Expected 50 WAV files; got $wavCount" }
          Write-Host "PHASE3_36E_PUBLIC_FILES=$($files.Count)"
          Write-Host "PHASE3_36E_PUBLIC_WAVS=$wavCount"
          Write-Host "PHASE3_36E_BLINDING_KEY_INCLUDED=0"

      - name: Upload blinded listening bundle only
        uses: actions/upload-artifact@v4
        with:
          name: phase3-denoiser-human-ab-review-bundle
          path: phase3-denoiser-human-ab-bundle
          if-no-files-found: error
          retention-days: 14

      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Phase 3.6e listening bundle only. Public artifact contains 10 clean references and 20 blinded A/B pairs. It contains no candidate identities or A/B key. No candidate selection, denoise authorization, renderer authorization or auto_apply is created."
