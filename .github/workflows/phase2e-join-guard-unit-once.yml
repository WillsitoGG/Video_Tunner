name: Phase 2E Join Guard Unit Validation Once

on:
  push:
    branches:
      - phase2e-post-render-verification
    paths:
      - .github/triggers/phase2e-join-guard-unit

jobs:
  windows-unit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Syntax preflight
        shell: pwsh
        run: |
          python -m py_compile .\Source\video_tunner\join_safety.py
          python -m py_compile .\.github\scripts\run_phase2e_12s3s_pipeline_gate.py
          python -m py_compile .\tests\test_join_safety_chunked_exact_repeat.py
      - name: Join safety regressions
        run: python -m unittest discover -s tests -p "test_join_safety*.py" -v
      - name: Full unit regression suite
        run: python -m unittest discover -s tests -v
