name: Phase 3.6g DeepFilterNet Portable Contract

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/phase3-deepfilter-portable-contract.trigger"

concurrency:
  group: phase3-deepfilter-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-portable-contract:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PHASE3_FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-05-13-10/ffmpeg-n9.0.1-26-g5c8e7e2433-win64-gpl-9.0.zip
      PHASE3_FFMPEG_SHA256: a8ebbaf7a99185f5abc3a2d3a657521c38d7966f06b70468d7ab29a67fe8654f
      PHASE3_FFMPEG_VERSION_TOKEN: n9.0.1-26-g5c8e7e2433
      PHASE3_DEEPFILTER_SHA256: 75e11fa16445f560cb6b021521ddb89e89270d13b83089705d98776f58fd7915
      PHASE3_DEEPFILTER_SIZE: "26912256"
      PHASE3_DEEPFILTER_VERSION: "0.5.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight editable package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Validate frozen selection and runtime contract
        run: >-
          python -m unittest -v
          tests.test_denoise_runtime
          tests.test_tools_portable
          tests.test_phase3_denoiser_selection_review_evidence

      - name: Build analysis portable with selected immutable DeepFilterNet
        shell: pwsh
        run: |
          .\.github\scripts\build_portable_windows.ps1 -Python python -Profile analysis -FfmpegUrl $env:PHASE3_FFMPEG_URL

      - name: Verify portable provenance and non-executable denoise state
        shell: pwsh
        run: |
          $portable = (Resolve-Path "dist\Video_Tunner").Path
          $manifestPath = Join-Path $portable "portable-manifest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.schema_version -ne 3) { throw "Unexpected portable manifest schema." }
          if ($manifest.profile -ne "portable-analysis-spike") { throw "Unexpected portable profile." }
          if ($manifest.ffmpeg_source -ne $env:PHASE3_FFMPEG_URL) { throw "FFmpeg URL mismatch." }
          if ($manifest.ffmpeg_archive_sha256 -ne $env:PHASE3_FFMPEG_SHA256) { throw "FFmpeg archive SHA mismatch." }
          if ($manifest.ffmpeg -notmatch [regex]::Escape($env:PHASE3_FFMPEG_VERSION_TOKEN)) { throw "FFmpeg version mismatch." }

          $denoiser = $manifest.selected_denoiser
          if ($denoiser.candidate_id -ne "deepfilternet_0_5_6_compensated_v1") { throw "Selected candidate mismatch." }
          if ($denoiser.version -ne $env:PHASE3_DEEPFILTER_VERSION) { throw "DeepFilterNet version mismatch." }
          if ($denoiser.asset_sha256 -ne $env:PHASE3_DEEPFILTER_SHA256) { throw "DeepFilterNet manifest SHA mismatch." }
          if ([int64]$denoiser.asset_size_bytes -ne [int64]$env:PHASE3_DEEPFILTER_SIZE) { throw "DeepFilterNet manifest size mismatch." }
          if ($denoiser.runtime_relative_path -ne "Tools/deepfilter/bin/deep-filter.exe") { throw "DeepFilterNet runtime path mismatch." }
          if ($denoiser.runtime_download_allowed -ne $false) { throw "Runtime download unexpectedly allowed." }
          if ($denoiser.product_default -ne "preserve") { throw "Product default changed." }
          if ($denoiser.denoise_authorized -ne $false -or $denoiser.renderer_authorized -ne $false -or $denoiser.auto_apply -ne $false) {
            throw "3.6g unexpectedly authorized denoise execution."
          }

          $deepfilter = Join-Path $portable "Tools\deepfilter\bin\deep-filter.exe"
          if (-not (Test-Path $deepfilter -PathType Leaf)) { throw "Bundled DeepFilterNet missing." }
          $actualSha = (Get-FileHash $deepfilter -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualSize = (Get-Item $deepfilter).Length
          if ($actualSha -ne $env:PHASE3_DEEPFILTER_SHA256) { throw "Bundled DeepFilterNet SHA mismatch." }
          if ($actualSize -ne [int64]$env:PHASE3_DEEPFILTER_SIZE) { throw "Bundled DeepFilterNet size mismatch." }
          Write-Host "PHASE3_6G_PORTABLE_PROVENANCE=PASS"

      - name: Run DeepFilterNet smoke with outbound network blocked
        shell: pwsh
        run: |
          $deepfilter = (Resolve-Path "dist\Video_Tunner\Tools\deepfilter\bin\deep-filter.exe").Path
          $ruleName = "VideoTunner-Phase36g-$env:GITHUB_RUN_ID"
          try {
            New-NetFirewallRule -DisplayName $ruleName -Direction Outbound -Program $deepfilter -Action Block -Profile Any | Out-Null
            python .github\scripts\run_phase3_deepfilter_portable_smoke.py --exe $deepfilter --work-dir .phase3-deepfilter-offline-smoke | Tee-Object -FilePath phase3-deepfilter-offline-smoke.json
            if ($LASTEXITCODE -ne 0) { throw "Offline DeepFilterNet smoke failed." }
            Write-Host "PHASE3_6G_DEEPFILTER_OFFLINE_SMOKE=PASS"
          }
          finally {
            Remove-NetFirewallRule -DisplayName $ruleName -ErrorAction SilentlyContinue
          }

      - name: Confirm tampered selected binary fails closed
        shell: pwsh
        run: |
          $source = (Resolve-Path "dist\Video_Tunner\Tools\deepfilter\bin\deep-filter.exe").Path
          $tampered = Join-Path $env:RUNNER_TEMP "deep-filter-tampered.exe"
          Copy-Item $source $tampered -Force
          [System.IO.File]::AppendAllBytes($tampered, [byte[]](0x00))
          python -c "from pathlib import Path; import sys; from video_tunner.denoise_runtime import DenoiserRuntimeError, validate_selected_denoiser_binary; p=Path(sys.argv[1]);
          try: validate_selected_denoiser_binary(p)
          except DenoiserRuntimeError as exc: print('PHASE3_6G_TAMPER_FAIL_CLOSED=PASS', exc)
          else: raise SystemExit('Tampered DeepFilterNet was accepted')" $tampered
          if ($LASTEXITCODE -ne 0) { throw "Tamper fail-closed check failed." }

      - name: Run integrated regression against bundled FFmpeg
        shell: pwsh
        run: |
          $env:VIDEO_TUNNER_FFMPEG_DIR = (Resolve-Path "dist\Video_Tunner\Tools\ffmpeg\bin").Path
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Integrated regression failed." }

      - name: Runtime doctor
        shell: pwsh
        run: |
          $env:VIDEO_TUNNER_FFMPEG_DIR = (Resolve-Path "dist\Video_Tunner\Tools\ffmpeg\bin").Path
          video-tunner doctor
          if ($LASTEXITCODE -ne 0) { throw "Development doctor failed." }
          .\dist\Video_Tunner\Video_Tunner.exe doctor
          if ($LASTEXITCODE -ne 0) { throw "Portable doctor failed." }

      - name: Upload lightweight 3.6g evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3-deepfilter-portable-contract-evidence
          path: |
            dist/Video_Tunner/portable-manifest.json
            phase3-deepfilter-offline-smoke.json
          if-no-files-found: error
          retention-days: 14

      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Phase 3.6g validates only immutable/offline portable availability of the selected DeepFilterNet 0.5.6 binary."
          Write-Host "It does NOT add a denoise renderer, does NOT authorize denoise, and does NOT change product default preserve."
