name: Phase 3 Focal Quality Baseline Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-focal-quality-baseline-once.yml

permissions:
  actions: read
  contents: read

jobs:
  windows-focal-baseline:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          ffmpeg -version | Select-Object -First 1

      - name: Download exact Phase 2E.5 listening bundle
        uses: actions/download-artifact@v4
        with:
          name: phase2e-human-render-review-bundle
          path: ${{ runner.temp }}\phase2e-human-render-review-bundle
          repository: WillsitoGG/Video_Tunner
          run-id: 34119952855
          github-token: ${{ github.token }}

      - name: Measure focal ORIGINAL vs RENDERED baseline
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m py_compile .\.github\scripts\run_phase3_focal_quality_baseline.py .\Source\video_tunner\audiovisual_quality.py
          python .\.github\scripts\run_phase3_focal_quality_baseline.py `
            --bundle-root "${{ runner.temp }}\phase2e-human-render-review-bundle" `
            --reviews-root ".\Validation\phase2e-human-closeout" `
            --output "${{ runner.temp }}\phase3-focal-quality-baseline.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload lightweight baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3-focal-quality-baseline
          path: ${{ runner.temp }}\phase3-focal-quality-baseline.json
          retention-days: 7
          if-no-files-found: error

      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Descriptive evidence only: observed deltas are not treatment thresholds."
          Write-Host "The current three-case corpus cannot justify mandatory normalization, denoise or default join smoothing."
          Write-Host "No treatment or auto_apply capability is created."
