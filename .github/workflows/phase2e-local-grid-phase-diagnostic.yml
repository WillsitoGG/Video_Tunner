name: Phase 2E Local Grid Phase Diagnostic

on:
  workflow_dispatch:

concurrency:
  group: video-tunner-phase2e-local-grid-phase-${{ github.ref }}
  cancel-in-progress: true

env:
  PHASE2E_HUMAN_FIXTURE: tests\fixtures\phase2e_human_render_closeout_ami_v1.json

jobs:
  windows-local-grid-phase:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight diagnostic
        shell: pwsh
        run: |
          python -m py_compile .\.github\scripts\run_phase2e_local_grid_phase_diagnostic.py
          Write-Host "PHASE2E_LOCAL_GRID_PREFLIGHT=PASS"

      - name: Install pinned analysis runtime
        run: python -m pip install -e .[analysis]

      - name: Download licensed AMI speaker-specific sources
        shell: pwsh
        run: .\.github\scripts\download_ami_positive_closeout_fixtures.ps1 -Fixture $env:PHASE2E_HUMAN_FIXTURE

      - name: Acquire pinned large-v3-turbo model
        shell: pwsh
        run: .\.github\scripts\download_large_v3_turbo_direct.ps1

      - name: Compare local-grid raw overlapping windows
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          $env:HF_HUB_OFFLINE = "1"
          $env:HF_HUB_DISABLE_XET = "1"
          $output = Join-Path $env:RUNNER_TEMP "Video Tunner Phase2E Local Grid Phase Diagnostic"
          python .\.github\scripts\run_phase2e_local_grid_phase_diagnostic.py `
            --fixture $env:PHASE2E_HUMAN_FIXTURE `
            --model-stage $env:SPANISH_TARGET_MODEL_STAGE `
            --output $output

      - name: Upload lightweight diagnostic manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2e-local-grid-phase-diagnostic
          path: ${{ runner.temp }}\Video Tunner Phase2E Local Grid Phase Diagnostic\manifest.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Scope note
        if: always()
        shell: pwsh
        run: |
          Write-Host "Diagnostic only: six raw Whisper windows, no canonical transcript or pipeline mutation."
          Write-Host "No detector/guard/limit is changed and no approval, edit or render is performed."
