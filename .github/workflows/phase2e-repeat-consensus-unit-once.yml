name: Phase 2E Repeat Consensus Unit Once

on:
  push:
    branches:
      - phase2e-post-render-verification
    paths:
      - .github/triggers/phase2e-repeat-consensus-unit

jobs:
  windows-unit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Syntax preflight
        run: python -m py_compile .\Source\video_tunner\transcription_consensus.py .\tests\test_transcription_repeat_consensus.py
      - name: Repeat consensus and chunking regressions
        run: python -m unittest tests.test_transcription_repeat_consensus tests.test_transcription_chunking -v
