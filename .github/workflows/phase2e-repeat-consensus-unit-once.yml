name: Phase 2E Repeat Consensus Unit Once

on:
  push:
    branches:
      - phase2e-post-render-verification
    paths:
      - .github/workflows/phase2e-repeat-consensus-unit-once.yml

jobs:
  windows-repeat-consensus-unit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Compile and run focused tests
        shell: pwsh
        run: |
          python -m py_compile .\Source\video_tunner\transcription_consensus.py
          python -m unittest tests.test_transcription_repeat_consensus tests.test_analysis_transcription_strategy tests.test_transcription_profiles tests.test_transcription_chunking -v
          Write-Host "PHASE2E_REPEAT_CONSENSUS_UNIT=PASS"
      - name: Scope note
        if: always()
        shell: pwsh
        run: |
          Write-Host "Focused unit validation only. No model/audio/download/render."
          Write-Host "No product default, threshold, detector, approval or execution setting changed."
