name: Phase 3 Noise Audit Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-noise-audit-once.yml

permissions:
  contents: read

jobs:
  windows-noise-audit:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - name: Validate Phase 3.6a noise measurement contract and real FFmpeg E2E
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m py_compile .\Source\video_tunner\noise_audit.py
          python -m unittest tests.test_noise_audit tests.test_noise_audit_e2e_ffmpeg -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE3_NOISE_AUDIT=PASS"
      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Phase 3.6a is measurement-only. Evidence sufficiency is not a denoise threshold. No filter selection, denoise authorization, treatment authorization or auto_apply is created."
