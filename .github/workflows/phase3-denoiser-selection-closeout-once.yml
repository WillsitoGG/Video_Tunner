name: Phase 3 Denoiser Selection Closeout Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-denoiser-selection-closeout-once.yml

permissions:
  contents: read

jobs:
  closeout:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact post-selection snapshot
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure FFmpeg for integrated regression
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg --no-progress -y }
          ffmpeg -version | Select-Object -First 1

      - name: Install analysis profile
        run: python -m pip install -e .[analysis]

      - name: Focused persisted selection binder
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m unittest tests.test_denoise_selection tests.test_phase3_denoiser_selection_review_evidence -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full integrated regression
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Doctor
        shell: pwsh
        run: |
          video-tunner doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reconfirm non-executable selection state
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          evidence = json.loads(Path('Validation/phase3-denoiser-selection-review.json').read_text(encoding='utf-8'))
          assert evidence['status'] == 'SELECTED_FOR_INTEGRATION_REVIEW'
          assert evidence['selected_candidate_id'] == 'deepfilternet_0_5_6_compensated_v1'
          assert evidence['interpretation']['product_default'] == 'preserve'
          assert evidence['interpretation']['product_default_changed'] is False
          assert evidence['interpretation']['denoise_authorized'] is False
          assert evidence['interpretation']['renderer_authorized'] is False
          assert evidence['interpretation']['auto_apply'] is False
          print('PHASE3_36F_CLOSEOUT_SELECTION=deepfilternet_0_5_6_compensated_v1')
          print('PHASE3_36F_CLOSEOUT_PRODUCT_DEFAULT=preserve')
          print('PHASE3_36F_CLOSEOUT_EXECUTION_AUTHORIZATION=0')
          '@ | python -
