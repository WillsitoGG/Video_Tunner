name: Phase 3 Persist Denoiser Comparison Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-persist-denoiser-comparison-once.yml

permissions:
  contents: write
  actions: read

jobs:
  persist-evidence:
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: phase3-audiovisual-quality-audit

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact successful 3.6d artifact
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "phase3-36d-artifact"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          gh run download 34145308485 --repo WillsitoGG/Video_Tunner --name phase3-denoiser-candidate-objective-comparison --dir $dest
          $json = Get-ChildItem -Path $dest -Filter phase3-denoiser-candidate-comparison.json -File | Select-Object -First 1
          if (-not $json) { throw "Expected comparison JSON missing from exact artifact" }
          $sha = (Get-FileHash -Algorithm SHA256 $json.FullName).Hash.ToLowerInvariant()
          $size = $json.Length
          Write-Host "PHASE3_36D_RAW_JSON_SHA256=$sha"
          Write-Host "PHASE3_36D_RAW_JSON_SIZE=$size"
          if ($sha -ne "0b1215fcd26b709ce3c8d232a2144b74c70e3dc13ec3bd7ab706793948d37023") { throw "Raw comparison JSON SHA mismatch" }
          if ($size -ne 264619) { throw "Raw comparison JSON size mismatch" }
          "PHASE3_36D_RAW_JSON=$($json.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Add immutable run and artifact provenance and persist under Validation
        shell: pwsh
        run: |
          @'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["PHASE3_36D_RAW_JSON"])
          payload = json.loads(source.read_text(encoding="utf-8"))
          if payload.get("record_type") != "denoiser_candidate_objective_comparison" or payload.get("valid") is not True:
              raise SystemExit("Unexpected/invalid raw comparison artifact")
          if payload.get("candidate_count") != 3:
              raise SystemExit("Raw comparison candidate count mismatch")
          payload["provenance"] = {
              "evidence_source": "github_actions_artifact",
              "workflow_run_id": 34145308485,
              "workflow_job_id": 101815955163,
              "run_head_sha": "1c181220f78acec62250ce724834a0073daeec39",
              "artifact_id": 10027581922,
              "artifact_name": "phase3-denoiser-candidate-objective-comparison",
              "artifact_digest": "sha256:db8202040779a74351e3c1f1a8766245916924deb37ae727c93f3782cb8df9b8",
              "raw_comparison_json_sha256": "0b1215fcd26b709ce3c8d232a2144b74c70e3dc13ec3bd7ab706793948d37023",
              "raw_comparison_json_size_bytes": 264619,
              "note": "Provenance was appended after the successful objective-comparison run. All comparison fields are byte-derived from the exact uploaded JSON above; no metrics or cases were recomputed or filtered during persistence."
          }
          destination = Path("Validation/phase3-denoiser-candidate-objective-comparison.json")
          destination.write_text(json.dumps(payload, separators=(",", ":"), ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"PHASE3_36D_PERSISTED_BYTES={destination.stat().st_size}")
          '@ | python -

      - name: Validate persisted evidence binding before commit
        run: python -m unittest tests.test_phase3_denoiser_candidate_comparison_evidence tests.test_phase3_denoiser_candidate_comparison_policy -v

      - name: Commit only permanent comparison evidence
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Validation/phase3-denoiser-candidate-objective-comparison.json
          $staged = git diff --cached --name-only
          if ($staged -ne "Validation/phase3-denoiser-candidate-objective-comparison.json") { throw "Unexpected staged files: $staged" }
          git commit -m "Persist Phase 3.6d denoiser comparison evidence"
          git push origin HEAD:phase3-audiovisual-quality-audit

      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "Persistence only. Existing successful 3.6d artifact is SHA-bound and copied to Validation with provenance. No candidate selection, denoise authorization, renderer authorization or auto_apply is introduced."
