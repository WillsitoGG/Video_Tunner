name: Phase 3 Normalization Profile Once

on:
  push:
    branches:
      - phase3-audiovisual-quality-audit
    paths:
      - .github/workflows/phase3-normalization-profile-once.yml

permissions:
  contents: read

jobs:
  windows-normalization-profile:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Phase 3 treatment/profile contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\Source"
          python -m py_compile .\Source\video_tunner\audiovisual_treatment.py .\Source\video_tunner\normalization_profiles.py
          python -m unittest tests.test_audiovisual_treatment tests.test_normalization_profiles -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHASE3_NORMALIZATION_PROFILE=PASS"
      - name: Scope note
        shell: pwsh
        run: |
          Write-Host "preserve is default. EBU R128 is explicit opt-in review-only. No normalization render capability exists in this gate."
