name: Phase 3.6k Persisted Bundle Evidence One-shot

on:
  push:
    paths:
      - ".github/phase3-denoise-treatment-human-bundle-evidence.trigger"

jobs:
  binder:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install editable package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Validate persisted Phase 3.6k bundle evidence
        run: >-
          python -m unittest -v
          tests.test_phase3_denoise_treatment_human_closeout_precommit
          tests.test_denoise_treatment_human_closeout
          tests.test_phase3_denoise_treatment_human_bundle_evidence
      - name: Scope note
        run: echo PHASE3_6K_PERSISTED_BUNDLE_EVIDENCE=PASS
